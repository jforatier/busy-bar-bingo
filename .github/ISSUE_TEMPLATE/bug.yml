name: Bug
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks! One bug per issue, please. Check the [open issues](https://github.com/jforatier/busy-bar-bingo/issues) first.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the BUSY app, or the release you installed.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: BUSY app → your bar → firmware, or the emulator's version.
      placeholder: 1.5.1
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: ["A BUSY Bar", "The emulator"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, what you expected, what happened
      description: Which game (75 or 90 balls), which settings, front or back, and at which moment.
      placeholder: |
        1. New game, 90 balls
        2. Draw 5 balls, quit with Back, open the app again
        Expected: … / Happened: …
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Photo, video or screen capture
      description: Drag it here. For sound or animation issues, a short video with sound helps most.
